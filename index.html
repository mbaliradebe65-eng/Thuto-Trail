<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thuto Trail</title><meta name="theme-color" content="#0B6E4F">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<style>
:root{--g:#0B6E4F;--y:#F2B705;--bg:#F7F5EF;--tx:#1b1b1b;--card:#fff;--mu:#666}
@media(prefers-color-scheme:dark){:root{--bg:#121513;--tx:#eee;--card:#1c211e;--mu:#aaa}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--g);color:#fff;padding:14px 16px}header h1{margin:0;font-size:1.3rem}header small{opacity:.85}
nav{display:flex;overflow-x:auto;gap:4px;padding:8px;background:var(--card);position:sticky;top:0;border-bottom:1px solid #8883}
nav button{flex:none;border:0;background:none;color:var(--tx);padding:8px 12px;border-radius:20px;font:inherit}
nav button.on{background:var(--y);color:#000;font-weight:600}
main{max-width:640px;margin:auto;padding:16px}
label{display:block;margin:8px 0;font-size:.9rem;color:var(--mu)}
input,select{width:100%;padding:10px;font:inherit;border:1px solid #8886;border-radius:8px;background:var(--card);color:var(--tx)}
input[type=checkbox]{width:auto}
button.p{background:var(--g);color:#fff;border:0;padding:12px 18px;border-radius:8px;font:inherit;margin:10px 6px 10px 0}
.c{background:var(--card);border-radius:10px;padding:12px;margin:10px 0;border:1px solid #8883}
.m{color:var(--mu);font-size:.9rem}.ok{color:var(--g);font-weight:600}.warn{color:#b45309;font-weight:600}
.b{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--y);color:#000;font-size:.8rem}
#bn{background:var(--y);color:#000;padding:12px;text-align:center}#bn button{margin:6px 4px 0;padding:6px 14px}
</style></head><body>
<header><h1>Thuto Trail</h1><small>Guided. Affordable. Always with you.</small></header>
<div id="bn" hidden></div><nav id="nav"></nav><main id="app"></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body></html>
